<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram 雲端音樂盒</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2481cc;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 24px; border: 1px solid var(--border-color);
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: var(--primary-color); }
        
        /* Token 輸入框樣式 */
        .config-section {
            background: #f9f9f9; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid var(--border-color);
        }
        .config-section label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .config-section input { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; }
        
        .player-card { text-align: center; background: linear-gradient(135deg, #e0f2fe, #f0fdf4); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        #current-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        #current-artist { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        audio { width: 100%; margin-top: 8px; }
        .status-bar { font-size: 12px; color: var(--primary-color); text-align: center; min-height: 18px; margin-bottom: 16px; }
        
        /* 歌單列表樣式 */
        .track-list { list-style: none; max-height: 240px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        .track-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .track-item:last-child { border-bottom: none; }
        .track-item:hover { background-color: #f1f5f9; }
        .track-item.active { background-color: #e0f2fe; color: var(--primary-color); font-weight: bold; }
        .track-info { display: flex; flex-direction: column; }
        .track-title { font-size: 14px; }
        .track-artist { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <h1>TG 雲端音樂盒</h1>

    <div class="config-section">
        <label for="bot-token">Telegram Bot Token (自動本地加密儲存)</label>
        <input type="password" id="bot-token" placeholder="請貼入您 `/revoke` 後拿到的新 Token">
    </div>

    <div class="player-card">
        <div id="current-title">未選擇歌曲</div>
        <div id="current-artist">請點擊下方歌單播放</div>
        <audio id="audio-player" controls></audio>
    </div>

    <div id="status-bar" class="status-bar">正在載入歌單...</div>
    <ul id="track-list" class="track-list"></ul>
</div>

<script>
    const audioPlayer = document.getElementById('audio-player');
    const statusBar = document.getElementById('status-bar');
    const trackListElement = document.getElementById('track-list');
    const tokenInput = document.getElementById('bot-token');
    
    let tracks = [];
    let currentActiveItem = null;

    // 1. 初始化：自動讀取上一次儲存在瀏覽器裡的 Token
    if (localStorage.getItem('tg_bot_token')) {
        tokenInput.value = localStorage.getItem('tg_bot_token');
    }

    // 當用戶修改輸入框時，同步更新到本地緩存
    tokenInput.addEventListener('input', (e) => {
        localStorage.setItem('tg_bot_token', e.target.value.trim());
    });

    // 2. 異步讀取同目錄下的 txt.json 索引
    async function loadPlaylist() {
        try {
            const response = await fetch('txt.json');
            if (!response.ok) throw new Error('無法讀取 txt.json，請檢查文件是否存在');
            tracks = await response.json();
            renderPlaylist(tracks);
            statusBar.innerText = `歌單載入成功，共 ${tracks.length} 首歌曲`;
        } catch (err) {
            statusBar.innerText = '錯誤: ' + err.message;
            statusBar.style.color = 'red';
        }
    }

    // 3. 渲染歌單 UI
    function renderPlaylist(playlist) {
        trackListElement.innerHTML = '';
        playlist.forEach((track, index) => {
            const li = document.createElement('li');
            li.className = 'track-item';
            li.innerHTML = `
                <div class="track-info">
                    <span class="track-title">${track.title}</span>
                    <span class="track-artist">${track.artist || '未知藝術家'}</span>
                </div>
            `;
            li.addEventListener('click', () => playTrack(track, li));
            trackListElement.appendChild(li);
        });
    }

    // 4. 核心邏輯：用 file_id 動態向 TG 交換真實音訊流網址
    async function playTrack(track, element) {
        const token = tokenInput.value.trim();
        if (!token) {
            alert('請先在網頁上方輸入您的 Telegram Bot Token！');
            return;
        }

        // 切換高亮
        if (currentActiveItem) currentActiveItem.classList.remove('active');
        element.classList.add('active');
        currentActiveItem = element;

        document.getElementById('current-title').innerText = track.title;
        document.getElementById('current-artist').innerText = track.artist || '未知藝術家';
        
        try {
            statusBar.innerText = `正在請求 Telegram 伺服器解析《${track.title}》...`;
            statusBar.style.color = '#2481cc';

            // 第一步：問 TG 要真實的 file_path
            const getFileUrl = `https://api.telegram.org/bot${token}/getFile?file_id=${track.file_id}`;
            const response = await fetch(getFileUrl);
            const data = await response.json();

            if (!data.ok) throw new Error(data.description || 'TG 拒絕請求，請檢查 Token 是否有效');

            const filePath = data.result.file_path;
            
            // 第二步：動態生成天生允許跨域的官方音訊播放直鏈
            const finalAudioUrl = `https://api.telegram.org/file/bot${token}/${filePath}`;

            // 第三步：直接交給播放器串流播放
            audioPlayer.src = finalAudioUrl;
            statusBar.innerText = '♪ 串流通道已建立，開始播放！';
            audioPlayer.play();

        } catch (err) {
            statusBar.innerText = '播放失敗: ' + err.message;
            statusBar.style.color = 'red';
            audioPlayer.src = '';
        }
    }

    // 網頁開啟時自動載入
    window.addEventListener('DOMContentLoaded', loadPlaylist);
</script>
</body>
</html>
