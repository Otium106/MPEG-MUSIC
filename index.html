<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Music Player</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --bubble-bg: rgba(255, 255, 255, 0.07);
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶端导航与按钮 */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: relative;
            z-index: 10;
        }

        .top-btn {
            width: 72px;
            height: 34px;
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .top-btn:hover { background-color: #222; }
        .top-btn img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 抽屉式弹窗 */
        .drawer {
            position: absolute;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: #111;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 20px;
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .drawer.active { top: 60px; }
        .drawer h3 { margin-bottom: 15px; font-size: 16px; font-weight: 400; }
        .drawer input {
            width: 100%;
            height: 36px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0 10px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .drawer input:focus { border-color: #666; outline: none; }
        .drawer button {
            width: 100%;
            height: 36px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 主体气泡布局 */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 20px;
            height: calc(100vh - 128px);
        }

        .bubble {
            background: var(--bubble-bg);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            height: 990px;
            max-height: 100%;
            overflow-y: auto;
            padding: 24px;
        }

        /* 左侧气泡 - 歌手 */
        #left-bubble { width: 420px; }
        .artist-item, .back-btn {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background 0.2s;
        }
        .artist-item:hover, .back-btn:hover { background: rgba(255,255,255,0.1); }
        .back-btn { color: var(--text-secondary); border-bottom: 1px solid #333; margin-bottom: 15px; }

        /* 中间气泡 - 歌曲列表 */
        #center-bubble { width: 1240px; }
        .song-table { width: 100%; border-collapse: collapse; text-align: left; }
        .song-table th {
            padding: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .song-table th:hover { color: #fff; }
        .song-table td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .song-row { cursor: pointer; transition: background 0.2s; }
        .song-row:hover { background: rgba(255,255,255,0.05); }
        .song-row.playing { background: rgba(255,255,255,0.1); color: #00fa9a; }
        .download-link { color: var(--text-secondary); text-decoration: none; }
        .download-link:hover { text-decoration: underline; color: #fff; }

        /* 右侧气泡 - 播放详情 */
        #right-bubble {
            width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cover-box {
            width: 300px;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            background: #000;
        }
        .cover-box img { width: 100%; height: 100%; object-fit: cover; }
        .lyric-box {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 20px;
            overflow-y: auto;
        }
        .lyric-line {
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
            min-height: 28px;
        }
        .lyric-line.active { color: #00fa9a; font-weight: bold; }

        /* 底部播放器 */
        footer {
            height: 48px;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            position: relative;
            padding: 0 40px;
        }

        .control-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background-color 0.2s;
        }

        /* 随机播放样式 */
        #shuffle-btn { padding: 4px 8px; border-radius: 4px; }
        #shuffle-btn.active { background-color: #333; }

        /* 上下首缩放反馈 */
        .scale-btn:active { transform: scale(0.85); }

        
        .control-btn img{
            width:28px;
            height:28px;
            object-fit:contain;
        }
        #play-btn img{
            width:40px;
            height:40px;
            transition: transform 0.3s ease;
        }
        #shuffle-btn img,
        #prev-btn img,
        #next-btn img,
        #volume-btn img{
            width:26px;
            height:26px;
        }

        /* 播放/暂停旋转 */
        #play-btn img { transition: transform 0.3s ease; }
        #play-btn.playing-state img { transform: rotateY(180deg); }

        /* 进度条区域 */
        .progress-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 600px;
            height: 12px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: #666;
            width: 0%;
            border-radius: 2px;
        }
        .progress-slider {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            cursor: pointer;
            z-index: 2;
        }
        
        /* 进度条跟随气泡 */
        .time-bubble {
            position: absolute;
            bottom: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            display: none;
            transform: translateX(-50%);
            white-space: nowrap;
            border: 1px solid #444;
        }

        /* 音量区域 */
        .volume-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .volume-popover {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 120px;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            z-index: 5;
        }
        .volume-popover.active { display: flex; }
        .volume-slider-bg {
            width: 4px;
            height: 100%;
            background: #333;
            position: relative;
            cursor: pointer;
        }
        .volume-fill {
            width: 100%;
            background: #fff;
            position: absolute;
            bottom: 0;
            height: 70%;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <header>
        <button class="top-btn" id="left-drawer-toggle">
            <img src="images/SCHALELogo_W.png" alt="Admin">
        </button>
        <button class="top-btn" id="right-drawer-toggle">
            <img src="images/Trinity Fancy W.png" alt="Search">
        </button>

        <!-- 管理抽屉 -->
        <div class="drawer" id="admin-drawer">
            <h3>添加歌曲到仓库 (需要配置权限)</h3>
            <input type="text" id="gh-token" placeholder="GitHub Personal Access Token">
            <input type="text" id="song-url" placeholder="歌曲音频 URL (如 catbox 链接)">
            <input type="text" id="song-title" placeholder="歌曲名称">
            <input type="text" id="song-artist" placeholder="演唱者 / Artist">
            <button id="submit-song">写入 playlist.json 并提交</button>
        </div>

        <!-- 搜索抽屉 -->
        <div class="drawer" id="search-drawer">
            <h3>搜索歌曲库</h3>
            <input type="text" id="search-input" placeholder="输入歌曲名或歌手进行过滤...">
        </div>
    </header>

    <main>
        <!-- 左侧歌手气泡 -->
        <div class="bubble" id="left-bubble">
            <div id="artist-list-container"></div>
        </div>

        <!-- 中间列表气泡 -->
        <div class="bubble" id="center-bubble">
            <table class="song-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('title')">歌曲名称 <span id="sort-title"></span></th>
                        <th onclick="sortTable('artist')">演唱者 <span id="sort-artist"></span></th>
                        <th>下载</th>
                    </tr>
                </thead>
                <tbody id="song-list-body"></tbody>
            </table>
        </div>

        <!-- 右侧详情气泡 -->
        <div class="bubble" id="right-bubble">
            <div class="cover-box">
                <img id="track-cover" src="images/fail.webp" alt="Cover">
            </div>
            <div class="lyric-box" id="lyric-container">
                <div class="lyric-line">……我們盼望，七聲嘆息。</div>
                <div class="lyric-line">……我們記得，耶利哥的古則。</div>
            </div>
        </div>
    </main>

    <footer>
        <audio id="audio-element"></audio>

        <!-- 随机播放 -->
        <button class="control-btn" id="shuffle-btn">
            <img id="shuffle-img" src="images/shuffleplay1.webp" alt="Shuffle">
        </button>

        <!-- 上一首 -->
        <button class="control-btn scale-btn" id="prev-btn">
            <img id="prev-img" src="images/left1.webp" alt="Prev">
        </button>

        <!-- 播放/暂停 -->
        <button class="control-btn" id="play-btn">
            <img id="play-img" src="images/HIGHLANDER G.png" alt="Play">
        </button>

        <!-- 下一首 -->
        <button class="control-btn scale-btn" id="next-btn">
            <img id="next-img" src="images/right1.webp" alt="Next">
        </button>

        <!-- 进度条区域 -->
        <div class="progress-container" id="progress-area">
            <div class="progress-bar-bg" id="progress-bg">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <img src="images/slider.png" class="progress-slider" id="progress-slider" alt="slider">
            <div class="time-bubble" id="time-bubble">00:00</div>
        </div>

        <!-- 音量 -->
        <div class="volume-container">
            <button class="control-btn" id="volume-btn">
                <img id="volume-img" src="images/volume1.webp" alt="Volume">
            </button>
            <div class="volume-popover" id="volume-popover">
                <div class="volume-slider-bg" id="volume-bg">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // UTF-8 安全转 Base64（防止提交日/中文变成乱码）
function utf8ToBase64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => {
        return String.fromCharCode('0x' + p1);
    }));
}

// Base64 安全转 UTF-8（防止读取日/中文变成乱码）
function base64ToUtf8(str) {
    return decodeURIComponent(atob(str).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
}
        // 核心状态数据
        let playlist = []; 
        let currentFilteredList = [];
        let currentSongIndex = -1;
        let isShuffle = false;
        let currentArtistFilter = null;
        let sortState = { key: null, direction: 'asc' };

        // DOM 元素引用
        const audio = document.getElementById('audio-element');
        const songListBody = document.getElementById('song-list-body');
        const artistListContainer = document.getElementById('artist-list-container');
        const playBtn = document.getElementById('play-btn');
        const playImg = document.getElementById('play-img');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleImg = document.getElementById('shuffle-img');
        const prevBtn = document.getElementById('prev-btn');
        const prevImg = document.getElementById('prev-img');
        const nextBtn = document.getElementById('next-btn');
        const nextImg = document.getElementById('next-img');
        const trackCover = document.getElementById('track-cover');
        const lyricContainer = document.getElementById('lyric-container');

        // 初始化加载歌曲列表
        async function loadPlaylist() {
            try {
                const response = await fetch('playlist.json?t=' + Date.now());
                playlist = await response.json();
                currentFilteredList = [...playlist];
                renderSongList(currentFilteredList);
                renderArtistList();
            } catch (error) {
                console.error("加载 playlist.json 失败:", error);
            }
        }

        // 渲染歌曲列表
        function renderSongList(songs) {
            songListBody.innerHTML = '';
            songs.forEach((song) => {
                // 寻找在原完整列表中的索引
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const tr = document.createElement('tr');
                tr.className = `song-row ${originalIndex === currentSongIndex ? 'playing' : ''}`;
                tr.innerHTML = `
                    <td>${song.title}</td>
                    <td>${song.artist}</td>
                    <td><a class="download-link" href="${song.url}" target="_blank" download onclick="event.stopPropagation()">下载</a></td>
                `;
                tr.onclick = () => playSong(originalIndex);
                songListBody.appendChild(tr);
            });
        }

        // 渲染左侧歌手列表
        function renderArtistList() {
            artistListContainer.innerHTML = '';
            if (currentArtistFilter) {
                const back = document.createElement('div');
                back.className = 'back-btn';
                back.innerText = '← 返回全部歌手';
                back.onclick = () => {
                    currentArtistFilter = null;
                    filterSongs();
                    renderArtistList();
                };
                artistListContainer.appendChild(back);
            }

            // 统计各歌手歌曲数量
            const artistsMap = {};
            playlist.forEach(s => {
                artistsMap[s.artist] = (artistsMap[s.artist] || 0) + 1;
            });

            Object.keys(artistsMap).forEach(artist => {
                if (currentArtistFilter && currentArtistFilter !== artist) return;
                const div = document.createElement('div');
                div.className = 'artist-item';
                div.innerText = `${artist} (${artistsMap[artist]}首)`;
                div.onclick = () => {
                    currentArtistFilter = artist;
                    filterSongs();
                    renderArtistList();
                };
                artistListContainer.appendChild(div);
            });
        }

        // 结合搜索与歌手过滤器过滤歌曲
        function filterSongs() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            currentFilteredList = playlist.filter(song => {
                const matchArtist = currentArtistFilter ? song.artist === currentArtistFilter : true;
                const matchSearch = song.title.toLowerCase().includes(searchVal) || song.artist.toLowerCase().includes(searchVal);
                return matchArtist && matchSearch;
            });
            renderSongList(currentFilteredList);
        }

        // 排序逻辑
        function sortTable(key) {
            if (sortState.key === key) {
                sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.key = key;
                sortState.direction = 'asc';
            }
            
            document.getElementById('sort-title').innerText = '';
            document.getElementById('sort-artist').innerText = '';
            document.getElementById(`sort-${key}`).innerText = sortState.direction === 'asc' ? ' ▲' : ' ▼';

            currentFilteredList.sort((a, b) => {
                return sortState.direction === 'asc' 
                    ? a[key].localeCompare(b[key], 'zh-CN') 
                    : b[key].localeCompare(a[key], 'zh-CN');
            });
            renderSongList(currentFilteredList);
        }

        // 播放特定音乐
        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentSongIndex = index;
            const song = playlist[currentSongIndex];

            audio.src = song.url;
            audio.play();
            
            // 更新按钮及行高亮状态
            playBtn.classList.add('playing-state');
            playImg.src = 'images/HIGHLANDER W.png';
            renderSongList(currentFilteredList);

            // 联动 API 获取封面和歌词
            fetchMetaFromAPI(song.title, song.artist);
        }

        // 外部 API 获取封面与歌词 (CORS 免费公共 API)
        async function fetchMetaFromAPI(title, artist) {
            // 重置默认状态
            trackCover.src = 'images/fail.webp';
            lyricContainer.innerHTML = `
                <div class="lyric-line">……我們盼望，七聲嘆息。</div>
                <div class="lyric-line">……我們記得，耶利哥的古則。</div>
            `;

            const query = encodeURIComponent(`${title} ${artist}`);
            
            // 1. 获取封面 (利用 iTunes API 规避跨域问题)
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    // 将标准低清图转换成更高清版本
                    const coverUrl = data.results[0].artworkUrl100.replace('100x100bb', '400x400bb');
                    trackCover.src = coverUrl;
                }
            } catch (e) { console.warn("iTunes 封面获取失败", e); }

            // 2. 获取歌词 (利用公立免费的 LRCLIB API)
            try {
                const res = await fetch(`https://lrclib.net/api/search?q=${query}`);
                const data = await res.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseAndDisplayLrc(data[0].syncedLyrics);
                } else if (data && data.length > 0 && data[0].plainLyrics) {
                    parsePlainLyrics(data[0].plainLyrics);
                }
            } catch (e) { console.warn("LRCLIB 歌词获取失败", e); }
        }

        // 解析并处理动态时间轴滚动歌词
        let activeLyrics = [];
        function parseAndDisplayLrc(lrcText) {
            lyricContainer.innerHTML = '';
            activeLyrics = [];
            const lines = lrcText.split('\n');
            lines.forEach(line => {
                const match = line.match(/\[(\d+):(\d+)\.(\d+)\](.*)/);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = parseInt(match[3]);
                    const time = min * 60 + sec + ms/100;
                    const text = match[4].trim();
                    if (text) {
                        const div = document.createElement('div');
                        div.className = 'lyric-line';
                        div.innerText = text;
                        lyricContainer.appendChild(div);
                        activeLyrics.push({ time, element: div });
                    }
                }
            });
        }

        function parsePlainLyrics(text) {
            lyricContainer.innerHTML = '';
            activeLyrics = [];
            text.split('\n').forEach(line => {
                if(!line.trim()) return;
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.innerText = line;
                lyricContainer.appendChild(div);
            });
        }

        // 监听音频更新实现滚动歌词及自定义进度条
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration || 0;

            // 1. 进度条位置更新
            if (duration > 0 && !isDragging) {
                const percent = (currentTime / duration) * 100;
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('progress-slider').style.left = percent + '%';
            }

            // 2. 动态高亮同步歌词
            if (activeLyrics.length > 0) {
                let activeIndex = -1;
                for (let i = 0; i < activeLyrics.length; i++) {
                    if (currentTime >= activeLyrics[i].time) {
                        activeIndex = i;
                    } else {
                        break;
                    }
                }
                if (activeIndex !== -1) {
                    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                    const activeEl = activeLyrics[activeIndex].element;
                    activeEl.classList.add('active');
                    // 自动平滑滚动居中显示
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        // 歌曲自动播放下一首
        audio.addEventListener('ended', () => {
            handleNextPrev(1);
        });

        function handleNextPrev(direction) {
            if (playlist.length === 0) return;
            if (isShuffle) {
                const rand = Math.floor(Math.random() * playlist.length);
                playSong(rand);
            } else {
                let nextIndex = currentSongIndex + direction;
                if (nextIndex >= playlist.length) nextIndex = 0;
                if (nextIndex < 0) nextIndex = playlist.length - 1;
                playSong(nextIndex);
            }
        }

        // --- 底部控制栏事件监听 ---
        
        // 播放暂停切换与动画旋转
        playBtn.onclick = () => {
            if (currentSongIndex === -1 && playlist.length > 0) {
                playSong(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing-state');
                playImg.src = 'images/HIGHLANDER W.png';
            } else {
                audio.pause();
                playBtn.classList.remove('playing-state');
                playImg.src = 'images/HIGHLANDER G.png';
            }
        };

        // 随机播放
        shuffleBtn.onclick = () => {
            isShuffle = !isShuffle;
            if (isShuffle) {
                shuffleBtn.classList.add('active');
                shuffleImg.src = 'images/shuffleplay2.webp';
            } else {
                shuffleBtn.classList.remove('active');
                shuffleImg.src = 'images/shuffleplay1.webp';
            }
        };

        // 上一首反馈
        prevBtn.addEventListener('mousedown', () => prevImg.src = 'images/left2.webp');
        prevBtn.addEventListener('mouseup', () => prevImg.src = 'images/left1.webp');
        prevBtn.onclick = () => handleNextPrev(-1);

        // 下一首反馈
        nextBtn.addEventListener('mousedown', () => nextImg.src = 'images/right2.webp');
        nextBtn.addEventListener('mouseup', () => nextImg.src = 'images/right1.webp');
        nextBtn.onclick = () => handleNextPrev(1);

        // --- 拖拽进度条交互逻辑 ---
        const progressArea = document.getElementById('progress-area');
        const progressBg = document.getElementById('progress-bg');
        const timeBubble = document.getElementById('time-bubble');
        let isDragging = false;

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateProgressOnX(clientX) {
            const rect = progressBg.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            
            document.getElementById('progress-fill').style.width = (percent * 100) + '%';
            document.getElementById('progress-slider').style.left = (percent * 100) + '%';
            
            timeBubble.style.left = (percent * 100) + '%';
            if (audio.duration) {
                timeBubble.innerText = formatTime(percent * audio.duration);
            }
            return percent;
        }

        progressArea.addEventListener('mousedown', (e) => {
            isDragging = true;
            timeBubble.style.display = 'block';
            const pct = updateProgressOnX(e.clientX);
            
            function onMouseMove(moveEvent) {
                updateProgressOnX(moveEvent.clientX);
            }
            function onMouseUp(upEvent) {
                isDragging = false;
                timeBubble.style.display = 'none';
                const finalPct = updateProgressOnX(upEvent.clientX);
                if (audio.duration) {
                    audio.currentTime = finalPct * audio.duration;
                }
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        // --- 音量控制面板 ---
        const volumeBtn = document.getElementById('volume-btn');
        const volumeImg = document.getElementById('volume-img');
        const volumePopover = document.getElementById('volume-popover');
        const volumeBg = document.getElementById('volume-bg');
        const volumeFill = document.getElementById('volume-fill');

        volumeBtn.onclick = (e) => {
            e.stopPropagation();
            const isActive = volumePopover.classList.toggle('active');
            volumeImg.src = isActive ? 'images/volume2.webp' : 'images/volume1.webp';
        };

        document.addEventListener('click', () => {
            volumePopover.classList.remove('active');
            volumeImg.src = 'images/volume1.webp';
        });

        volumePopover.onclick = (e) => e.stopPropagation();

        volumeBg.onclick = (e) => {
            const rect = volumeBg.getBoundingClientRect();
            let pct = (rect.bottom - e.clientY) / rect.height;
            pct = Math.max(0, Math.min(1, pct));
            audio.volume = pct;
            volumeFill.style.height = (pct * 100) + '%';
        };

        // --- 抽屉与管理数据写入 (GitHub REST API) ---
        const leftToggle = document.getElementById('left-drawer-toggle');
        const rightToggle = document.getElementById('right-drawer-toggle');
        const adminDrawer = document.getElementById('admin-drawer');
        const searchDrawer = document.getElementById('search-drawer');

        leftToggle.onclick = () => {
            searchDrawer.classList.remove('active');
            adminDrawer.classList.toggle('active');
        };

        rightToggle.onclick = () => {
            adminDrawer.classList.remove('active');
            searchDrawer.classList.toggle('active');
        };

        document.getElementById('search-input').oninput = () => filterSongs();

        // 提交歌曲回写到远端 GitHub 仓库的逻辑
        document.getElementById('submit-song').onclick = async () => {
            const token = document.getElementById('gh-token').value;
            const url = document.getElementById('song-url').value;
            const title = document.getElementById('song-title').value;
            const artist = document.getElementById('song-artist').value;

            if (!token || !url || !title || !artist) {
                alert("请完整填写四行输入信息！");
                return;
            }

            // 根据当前 Pages 的路径推算 GitHub 仓库所有者与名字
            // 格式通常为: https://<username>.github.io/<repo>/
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const hostParts = window.location.hostname.split('.');
            
            let owner = hostParts[0];
            let repo = pathParts[0] || "";

            if (!repo) {
                alert("未能自动检测到仓库名，请确认是否已部署在 GitHub Pages 生产环境");
                return;
            }

            const apiPath = `https://api.github.com/repos/${owner}/${repo}/contents/playlist.json`;

            try {
                // 1. 获取当前远端文件的 sha 校验值以进行有损更新
                const getRes = await fetch(apiPath);
                if(!getRes.ok) throw new Error("无法读取远端 playlist.json 文件");
                const fileData = await getRes.json();
                const sha = fileData.sha;
                
                // 解码现有的列表内容
                const currentContent = JSON.parse(atob(fileData.content.replace(/\n/g, '')));
                
                // 2. 追加新歌曲记录入结构体
                currentContent.push({ title, artist, url });

                // 3. 构建规范加密的 PUT 请求直接更新 GitHub 库文件
                const putRes = await fetch(apiPath, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add song: ${title} - ${artist}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("歌曲成功写入远端！系统正在自动重新加载列表...");
                    adminDrawer.classList.remove('active');
                    loadPlaylist(); // 刷新本地列表
                } else {
                    const errData = await putRes.json();
                    alert("写入失败: " + errData.message);
                }
            } catch (err) {
                alert("请求发生异常: " + err.message);
            }
        };

        // 页面打开时自动装载
        window.onload = loadPlaylist;
    </script>
</body>
</html>
