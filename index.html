<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG 智能云同步音乐盒</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        
        /* 顶部配置栏 */
        header { background-color: #1f1f1f; padding: 15px 20px; display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 12px; border-bottom: 1px solid #2d2d2d; }
        header input { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        header button { background-color: #2481cc; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        header button:hover { background-color: #1c66a3; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 左侧音乐播放舱 */
        .player-container { flex: 1.4; background-color: #0b0b0b; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .audio-card { background: #1e1e1e; padding: 40px 30px; border-radius: 16px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #2d2d2d; }
        .audio-title { font-size: 22px; font-weight: bold; margin-bottom: 6px; word-break: break-all; color: #fff; }
        .audio-artist { font-size: 15px; color: #888; margin-bottom: 25px; }
        audio { width: 100%; margin-top: 10px; }
        
        /* 缓冲进度条 */
        .status-text { margin-top: 20px; font-size: 13px; color: #888; min-height: 18px; }
        .progress-bar-bg { width: 100%; background: #333; height: 6px; border-radius: 3px; margin-top: 10px; display: none; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #2481cc; width: 0%; }

        /* 右侧精致播放列表 */
        .playlist-container { flex: 1; background-color: #181818; border-left: 1px solid #2d2d2d; display: flex; flex-direction: column; }
        .playlist-header { padding: 20px 15px; background-color: #1f1f1f; border-bottom: 1px solid #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
        .btn-sync { background-color: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-sync:hover { background-color: #218838; }
        
        .list-items { flex: 1; overflow-y: auto; padding: 15px; }
        .playlist-item { background: #222; padding: 14px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #2d2d2d; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: background 0.2s; }
        .playlist-item:hover { border-color: #444; background: #282828; }
        .playlist-item.active { border-color: #2481cc; background: #142533; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; margin-bottom: 4px; }
        .item-artist-size { font-size: 12px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-del { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 13px; padding: 6px 10px; border-radius: 4px; font-weight: 500; }
        .btn-del:hover { background: rgba(220, 53, 69, 0.1); }
    </style>
</head>
<body>

    <header>
        <input type="text" id="tgToken" placeholder="Telegram Bot Token" />
        <input type="text" id="ghToken" placeholder="GitHub Token (PAT)" />
        <input type="text" id="ghRepo" placeholder="GitHub 仓库名 (用户名/仓库名)" />
        <button onclick="saveConfig()">保存配置</button>
    </header>

    <div class="main-container">
        <!-- 左侧：音乐盒主舱 -->
        <div class="player-container">
            <div class="audio-card">
                <div class="audio-title" id="currentTitle">🎵 未选择曲目</div>
                <div class="audio-artist" id="currentArtist">-</div>
                <audio id="mainAudio" controls></audio>
                <div class="progress-bar-bg" id="pBarBg"><div class="progress-bar-fill" id="pBarFill"></div></div>
                <div class="status-text" id="statusText">请从右侧列表选择音频进行本地缓冲播放</div>
            </div>
        </div>

        <!-- 右侧：手动控制曲目列表 -->
        <div class="playlist-container">
            <div class="playlist-header">
                <h3 style="font-size: 16px;">🎵 我的云端曲库</h3>
                <button class="btn-sync" onclick="manualSync()">🔄 同步新音频</button>
            </div>
            <div class="list-items" id="playlistItems">
                <!-- 动态载入 -->
            </div>
        </div>
    </div>

    <script>
        let playlist = [];
        let blacklist = [];
        let currentBlobUrl = null;

        window.onload = function() {
            document.getElementById('tgToken').value = localStorage.getItem('cfg_tg_token') || '';
            document.getElementById('ghToken').value = localStorage.getItem('cfg_gh_token') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('cfg_gh_repo') || '';
            
            // 首次渲染使用本地垫底缓存
            playlist = JSON.parse(localStorage.getItem('local_playlist')) || [];
            renderPlaylist();
        }

        function saveConfig() {
            localStorage.setItem('cfg_tg_token', document.getElementById('tgToken').value.trim());
            localStorage.setItem('cfg_gh_token', document.getElementById('ghToken').value.trim());
            localStorage.setItem('cfg_gh_repo', document.getElementById('ghRepo').value.trim());
            alert('配置已安全保存在浏览器本地！');
        }

        function getConfig() {
            return {
                tgToken: localStorage.getItem('cfg_tg_token'),
                ghToken: localStorage.getItem('cfg_gh_token'),
                ghRepo: localStorage.getItem('cfg_gh_repo')
            };
        }

        // 智能拆分函数：完全抛弃媒体标签，纯粹切分文件名
        function parseFileName(rawName, msgDate) {
            if (!rawName) {
                // 如果是根本没有名字的语音消息，使用时间戳兜底
                const timeStr = `${msgDate.getFullYear()}${(msgDate.getMonth()+1).toString().padStart(2,'0')}${msgDate.getDate().toString().padStart(2,'0')}_${msgDate.getHours().toString().padStart(2,'0')}${msgDate.getMinutes().toString().padStart(2,'0')}`;
                return { title: `未命名音频_${timeStr}`, artist: "未知来源" };
            }

            // 1. 去掉文件后缀名（如 .mp3, .m4a, .flac 等）
            const cleanName = rawName.replace(/\.[^/.]+$/, "");

            // 2. 基于统一的连字符“-”进行精准拆分
            if (cleanName.includes('-')) {
                const parts = cleanName.split('-');
                const title = parts[0].trim();
                // 拼接可能存在的多个减号后面的所有文本，防止歌手名字里带减号
                const artist = parts.slice(1).join('-').trim(); 
                return { title: title, artist: artist };
            } else {
                // 如果上传的文件没加减号，整段作为歌名，歌手设为未知
                return { title: cleanName, artist: "未知群星" };
            }
        }

        // GitHub API 封装
        async function fetchGitHubFile(filename, token, repo) {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${filename}`, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (res.status === 404) return { sha: null, data: [] };
                const json = await res.json();
                return {
                    sha: json.sha,
                    data: JSON.parse(atob(json.content.replace(/\n/g, '')))
                };
            } catch (e) {
                console.error(`读取 ${filename} 失败`, e);
                return { sha: null, data: [] };
            }
        }

        async function updateGitHubFile(filename, contentObj, sha, token, repo) {
            const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2))));
            await fetch(`https://api.github.com/repos/${repo}/contents/${filename}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: `Web Music Box Update ${filename}`,
                    content: contentBase64,
                    sha: sha
                })
            });
        }

        // 按需单次执行：手动刷新对账
        async function manualSync() {
            const { tgToken, ghToken, ghRepo } = getConfig();
            if (!tgToken || !ghToken || !ghRepo) return alert('请先完整填写顶部配置并保存！');

            document.getElementById('statusText').textContent = "正在拉取云端及 Telegram 消息流...";

            try {
                const ghPlaylist = await fetchGitHubFile('playlist.json', ghToken, ghRepo);
                const ghBlacklist = await fetchGitHubFile('blacklist.json', ghToken, ghRepo);
                
                playlist = ghPlaylist.data;
                blacklist = ghBlacklist.data;

                const lastUpdateId = localStorage.getItem('tg_last_id') || 0;
                const tgRes = await fetch(`https://api.telegram.org/bot${tgToken}/getUpdates?offset=${lastUpdateId}`);
                const tgData = await tgRes.json();

                let hasNew = false;

                if (tgData.ok && tgData.result.length > 0) {
                    tgData.result.forEach(update => {
                        localStorage.setItem('tg_last_id', update.update_id);
                        const msg = update.message;
                        
                        if (msg && (msg.audio || msg.voice || msg.document)) {
                            let audioObj = msg.audio || msg.voice || msg.document;
                            
                            if (msg.document && !msg.document.mime_type.startsWith('audio/')) {
                                audioObj = null; // 剔除 document 中的非音频文件
                            }

                            if (audioObj) {
                                const fileId = audioObj.file_id;
                                
                                // 双向防重校验
                                const inBlacklist = blacklist.includes(fileId);
                                const inPlaylist = playlist.some(item => item.fileId === fileId);

                                if (!inBlacklist && !inPlaylist) {
                                    // 🚀 执行智能拆分命名逻辑
                                    const msgDate = new Date(msg.date * 1000);
                                    const meta = parseFileName(audioObj.file_name, msgDate);
                                    const size = (audioObj.file_size / (1024 * 1024)).toFixed(2) + " MB";

                                    playlist.push({ fileId, title: meta.title, artist: meta.artist, size });
                                    hasNew = true;
                                }
                            }
                        }
                    });
                }

                // 有且仅有发现新歌时，才会向 GitHub 发起写入请求
                if (hasNew) {
                    await updateGitHubFile('playlist.json', playlist, ghPlaylist.sha, ghToken, ghRepo);
                }

                localStorage.setItem('local_playlist', JSON.stringify(playlist));
                renderPlaylist();
                document.getElementById('statusText').textContent = "同步对账完成，列表已成功更新！";

            } catch (err) {
                console.error(err);
                document.getElementById('statusText').textContent = "同步失败，请检查网络或配置。";
            }
        }

        // 按需单次执行：手动点击删除
        async function deleteItem(index, event) {
            event.stopPropagation(); // 封锁点击事件，不触发歌曲播放
            
            const confirmDel = confirm(`确定要移除《${playlist[index].title}》吗？移除后将自动将其 file_id 永久录入 GitHub 黑名单。`);
            if (!confirmDel) return;

            const { ghToken, ghRepo } = getConfig();
            document.getElementById('statusText').textContent = "正在将移除指令上报至 GitHub 仓库...";

            try {
                // 实时拉取最新 SHA，防止多端冲突
                const ghPlaylist = await fetchGitHubFile('playlist.json', ghToken, ghRepo);
                const ghBlacklist = await fetchGitHubFile('blacklist.json', ghToken, ghRepo);

                const targetFileId = playlist[index].fileId;

                // 1. 列表剔除
                playlist.splice(index, 1);
                // 2. 录入拉黑
                if (!blacklist.includes(targetFileId)) {
                    blacklist.push(targetFileId);
                }

                // 3. 有且仅在此时，发送请求写入 GitHub 仓库
                await updateGitHubFile('playlist.json', playlist, ghPlaylist.sha, ghToken, ghRepo);
                await updateGitHubFile('blacklist.json', blacklist, ghBlacklist.sha, ghToken, ghRepo);

                localStorage.setItem('local_playlist', JSON.stringify(playlist));
                renderPlaylist();
                document.getElementById('statusText').textContent = "成功移除曲目，黑名单已云端同步。";

            } catch (e) {
                alert('上报 GitHub 失败，请检查网络后重试。');
            }
        }

// 核心升级版：利用 Audio 原生流式加载，完美过墙解决 CORS 跨域，同时保留进度条
        async function loadAndPlay(fileId, index) {
            const { tgToken } = getConfig();
            const pBg = document.getElementById('pBarBg');
            const pFill = document.getElementById('pBarFill');
            const sText = document.getElementById('statusText');
            const audio = document.getElementById('mainAudio');

            // 1. 高亮选中的曲目
            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            
            // 2. 刷新卡片上的歌名与演唱者
            document.getElementById('currentTitle').textContent = playlist[index].title;
            document.getElementById('currentArtist').textContent = playlist[index].artist;

            // 3. 重置并显示进度条
            pBg.style.display = 'block';
            pFill.style.width = '0%';
            sText.textContent = "正在建立 Telegram 临时云端音频通道...";

            // 清理可能存在的旧事件，防止多次点击导致叠加混乱
            audio.onprogress = null;

            try {
                // 4. 依旧向 Telegram 申请路径
                const fileRes = await fetch(`https://api.telegram.org/bot${tgToken}/getFile?file_id=${fileId}`);
                const fileData = await fileRes.json();
                if (!fileData.ok) throw new Error("Telegram 拒绝提供音频路径");

                const realUrl = `https://api.telegram.org/file/bot${tgToken}/${fileData.result.file_path}`;
                sText.textContent = "通道已就绪，正在边下边播（流媒体极速启动）...";

                // 5. 【核心修复】不走 Fetch 二进制下载，直接喂给 src，利用浏览器原生通道豁免 CORS 拦截
                audio.src = realUrl;
                audio.load();

                // 6. 巧妙追踪原生缓冲进度（同样能让进度条跑起来！）
                audio.onprogress = function() {
                    if (audio.buffered.length > 0) {
                        const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
                        const duration = audio.duration;
                        if (duration > 0) {
                            let percent = ((bufferedEnd / duration) * 100).toFixed(0);
                            pFill.style.width = percent + '%';
                            sText.textContent = `流式缓存中: ${percent}% (已就绪 ${bufferedEnd.toFixed(0)}秒 / 共 ${duration.toFixed(0)}秒)`;
                            // 缓存完了就悄悄收起进度条
                            if (percent >= 99) pBg.style.display = 'none';
                        }
                    }
                };

                // 7. 触发自动播放
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        sText.textContent = "🎵 正在云端不限速流畅播放中...";
                    }).catch(error => {
                        // 如果浏览器拦截了非交互的自动播放，引导用户手动点一下
                        sText.textContent = "通道就绪！请点击下方的【播放键】开始聆听";
                    });
                }

            } catch (err) {
                sText.textContent = "❌ 播放失败: " + err.message;
                pBg.style.display = 'none';
            }
        }

                const blob = new Blob(chunks, { type: 'audio/mp3' });
                currentBlobUrl = URL.createObjectURL(blob);
                audio.src = currentBlobUrl;
                audio.load();
                audio.play();

                sText.textContent = "本地缓冲完毕，正在流畅播放。";
                pBg.style.display = 'none';

            } catch (err) {
                sText.textContent = "❌ 缓冲失败: " + err.message;
                pBg.style.display = 'none';
            }
        }

        // 渲染精致列表 UI
        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            container.innerHTML = playlist.length === 0 ? '<div style="color:#555;text-align:center;margin-top:30px;font-size:14px;">您的云端曲库为空<br>请给Bot发歌后点击[同步新音频]</div>' : '';

            playlist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.onclick = () => loadAndPlay(item.fileId, index);
                div.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-artist-size">👤 ${item.artist} &nbsp;·&nbsp; ${item.size}</div>
                    </div>
                    <button class="btn-del" onclick="deleteItem(${index}, event)">🗑️ 移除</button>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
